<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin La Casa da Pizza</title>
<style>
:root{--bg:#120900;--card:#24130c;--card2:#1b0e08;--line:#4e2b1d;--txt:#fff3df;--muted:#e7bc8f;--orange:#ff6b39;--gold:#ffb86c;--green:#2ecc71;--blue:#3498db;--red:#e74c3c;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.top h1{margin:0;color:var(--gold);font-size:24px}.top small{color:var(--muted)}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--orange);color:#180800;font-weight:800}.btn.secondary{background:#5d2c15;color:white}.btn.danger{background:var(--red);color:white}.btn.green{background:var(--green);color:#06190c}.btn.blue{background:var(--blue);color:white}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.box,.card{background:var(--card);border:1px solid #3c1e14;border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.25)}.box{width:100%;max-width:380px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;color:white}.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:6px}.tab{white-space:nowrap;background:#1f120a;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:800}.tab.active{background:var(--orange);color:#180800;border-color:var(--orange)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:var(--card);border:1px solid #3c1e14;border-radius:16px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:6px;color:var(--gold);font-size:24px}.card{margin-bottom:14px}.card h2{margin:0 0 10px;color:var(--gold);font-size:19px}.order{background:#1f120a;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.orderHead{display:flex;justify-content:space-between;gap:10px}.pill{display:inline-flex;border:1px solid var(--line);background:#140904;border-radius:999px;padding:5px 9px;color:var(--gold);font-size:12px;font-weight:800}.items{margin-top:8px;color:#f7d3ae;font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions select{background:#5d2c15;color:white;border:0;border-radius:10px;padding:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #3a1e14;padding:9px;text-align:left;font-size:13px}.table th{color:var(--gold)}.notice{background:#311a11;border:1px solid #4d2f22;border-radius:12px;padding:12px;color:#f5d3aa;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){.top{align-items:flex-start}.top h1{font-size:21px}.orderHead{flex-direction:column}.row{display:block}.row>*{margin-bottom:8px}.table{font-size:12px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="box"><h1 style="color:var(--gold);margin:0 0 6px">Admin La Casa</h1><p class="small">Entre com o email e senha do Supabase Auth.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">Entrar</button><div id="loginMsg" class="notice hidden"></div></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><h1>🍕 Admin La Casa</h1><small id="userText">Painel de pedidos</small></div><button class="btn secondary" onclick="logout()">Sair</button></div><div class="tabs"><button class="tab active" onclick="tab('dashboard')">Dashboard</button><button class="tab" onclick="tab('pedidos')">Pedidos</button><button class="tab" onclick="tab('produtos')">Produtos</button><button class="tab" onclick="tab('bairros')">Bairros</button><button class="tab" onclick="tab('funcionamento')">Funcionamento</button></div><div id="content"></div></div>
<script>
const SUPABASE_URL='https://kmjbulbsgiptzvhhweau.supabase.co';
const SUPABASE_KEY='sb_publishable_DqoB81h8n1YjjT6rZpEo1Q_dadcornK';
const AUTH_KEY='la_casa_admin_session_v2';
let session=null,current='dashboard',orders=[],products=[],bairros=[],settings={manual_closed:false,closed_days:[]};
const $=id=>document.getElementById(id); const money=v=>'R$ '+(Number(v)||0).toFixed(2).replace('.',',');
function headers(auth=false,extra={}){return Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+(auth&&session?.access_token?session.access_token:SUPABASE_KEY),'Content-Type':'application/json'},extra)}
async function api(path,opt={}){const r=await fetch(SUPABASE_URL+path,opt); if(!r.ok){const t=await r.text().catch(()=> ''); throw new Error(r.status+' '+t)} return r.status===204?null:r.json()}
async function login(){try{$('loginMsg').classList.add('hidden');const email=$('email').value.trim(),password=$('senha').value;if(!email||!password)throw new Error('Preencha email e senha.');const data=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:headers(false),body:JSON.stringify({email,password})});session={access_token:data.access_token,refresh_token:data.refresh_token,user:data.user,expires_at:Date.now()+(data.expires_in||3600)*1000};localStorage.setItem(AUTH_KEY,JSON.stringify(session));showApp();await loadAll();render()}catch(e){$('loginMsg').textContent='Erro ao entrar: '+e.message;$('loginMsg').classList.remove('hidden')}}
async function refresh(){if(!session)return false;if(Date.now()<session.expires_at-60000)return true;try{const data=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:headers(false),body:JSON.stringify({refresh_token:session.refresh_token})});session={access_token:data.access_token,refresh_token:data.refresh_token,user:data.user,expires_at:Date.now()+(data.expires_in||3600)*1000};localStorage.setItem(AUTH_KEY,JSON.stringify(session));return true}catch(e){logout();return false}}
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('userText').textContent=session?.user?.email||'Admin';}
function logout(){localStorage.removeItem(AUTH_KEY);session=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function loadAll(){await refresh(); await Promise.all([loadOrders(),loadProducts(),loadBairros(),loadSettings()]);}
async function loadOrders(){await refresh(); try{orders=await api('/rest/v1/orders?select=*,order_items(*)&order=created_at.desc&limit=100',{headers:headers(true)});}catch(e){console.warn('join falhou, tentando separado',e);orders=await api('/rest/v1/orders?select=*&order=created_at.desc&limit=100',{headers:headers(true)});try{const ids=orders.map(o=>o.id).join(',');const its=ids?await api('/rest/v1/order_items?select=*&order_id=in.('+ids+')',{headers:headers(true)}):[];orders.forEach(o=>o.order_items=its.filter(i=>String(i.order_id)===String(o.id)))}catch(err){orders.forEach(o=>o.order_items=[])}}}
async function loadProducts(){await refresh();products=await api('/rest/v1/products?select=*&order=category.asc,name.asc',{headers:headers(true)}).catch(()=>[])}
async function loadBairros(){await refresh();bairros=await api('/rest/v1/bairros?select=*&order=name.asc',{headers:headers(true)}).catch(()=>[])}
async function loadSettings(){const rows=await api('/rest/v1/store_settings?select=*&key=eq.status',{headers:headers(false)}).catch(()=>[]); if(rows[0]?.value)settings=Object.assign(settings,rows[0].value)}
function tab(name){current=name;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));[...document.querySelectorAll('.tab')].find(b=>b.textContent.toLowerCase().includes(name==='funcionamento'?'funcionamento':name))?.classList.add('active');render()}
function render(){if(current==='dashboard')renderDash();if(current==='pedidos')renderPedidos();if(current==='produtos')renderProdutos();if(current==='bairros')renderBairros();if(current==='funcionamento')renderFuncionamento()}
function today(){return new Date().toISOString().slice(0,10)}
function renderDash(){const hoje=orders.filter(o=>o.data===today());const totalHoje=hoje.reduce((s,o)=>s+Number(o.total||0),0);const novos=orders.filter(o=>o.status==='novo').length;const mes=today().slice(0,7);const totalMes=orders.filter(o=>(o.data||'').slice(0,7)===mes).reduce((s,o)=>s+Number(o.total||0),0);$('content').innerHTML=`<div class="grid"><div class="stat"><span>Pedidos hoje</span><strong>${hoje.length}</strong></div><div class="stat"><span>Novos</span><strong>${novos}</strong></div><div class="stat"><span>Faturamento hoje</span><strong>${money(totalHoje)}</strong></div><div class="stat"><span>Faturamento mês</span><strong>${money(totalMes)}</strong></div></div><div class="card"><h2>Últimos pedidos</h2><button class="btn" onclick="loadAll().then(render)">Atualizar</button>${orders.slice(0,8).map(orderHtml).join('')||'<div class="notice">Nenhum pedido.</div>'}</div>`}
function orderHtml(o){const items=(o.order_items||[]).map(i=>`${i.qty}x ${i.name} - ${money(Number(i.price)*Number(i.qty))}`).join('<br>')||'<span class="small">Sem itens carregados</span>';return `<div class="order"><div class="orderHead"><div><b style="color:var(--gold)">Pedido #${o.numero||String(o.id).slice(0,8)}</b><div class="small">${o.data||''} ${o.hora||''}</div></div><span class="pill">${o.status||'novo'}</span></div><div class="small" style="margin-top:7px">Cliente: ${o.cliente||'Não informado'}<br>Endereço: ${o.endereco||''} - ${o.bairro||''}<br>Pagamento: ${o.pagamento||''}<br>Total: <b>${money(o.total)}</b></div><div class="items">${items}</div><div class="actions"><select onchange="statusOrder('${o.id}',this.value)">${['novo','preparando','entregue','cancelado'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn secondary" onclick="printOrder('${o.id}')">Imprimir</button></div></div>`}
function renderPedidos(){$('content').innerHTML=`<div class="card"><h2>Pedidos</h2><div class="row"><button class="btn" onclick="loadOrders().then(render)">Atualizar pedidos</button><select id="filter" onchange="renderPedidos()"><option value="todos">Todos</option><option value="novo">Novos</option><option value="hoje">Hoje</option></select></div><div id="listPedidos"></div></div>`;const f=$('filter').value||'todos';let list=orders;if(f==='novo')list=orders.filter(o=>o.status==='novo');if(f==='hoje')list=orders.filter(o=>o.data===today());$('listPedidos').innerHTML=list.map(orderHtml).join('')||'<div class="notice">Nenhum pedido encontrado.</div>'}
async function statusOrder(id,status){await refresh();try{await api('/rest/v1/orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:headers(true,{Prefer:'return=minimal'}),body:JSON.stringify({status})});const o=orders.find(x=>String(x.id)===String(id));if(o)o.status=status;render()}catch(e){alert('Erro ao atualizar status: '+e.message)}}
function printOrder(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;const items=(o.order_items||[]).map(i=>`<tr><td>${i.qty}x</td><td>${i.name}</td><td>${money(Number(i.price)*Number(i.qty))}</td></tr>`).join('');const w=open('','_blank','width=360,height=640');w.document.write(`<html><head><meta charset="UTF-8"><style>@page{size:80mm auto;margin:0}body{font-family:Arial;color:#000;padding:8px;width:72mm}h2{text-align:center}td{border-bottom:1px dashed #999;padding:4px;font-size:12px}</style></head><body><h2>La Casa da Pizza</h2><p><b>Pedido #${o.numero||''}</b><br>${o.data||''} ${o.hora||''}</p><p>${o.cliente||''}<br>${o.endereco||''} - ${o.bairro||''}</p><table width="100%">${items}</table><h3>Total: ${money(o.total)}</h3><p>Pagamento: ${o.pagamento||''}</p></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function renderProdutos(){$('content').innerHTML=`<div class="card"><h2>Novo produto / bebida</h2><div class="row"><input id="pname" placeholder="Nome"><input id="pprice" type="number" step="0.5" placeholder="Preço"><select id="pcat"><option>Bebida</option><option>Pizza Preco</option><option>Pizza</option></select><button class="btn" onclick="addProduct()">Adicionar</button></div></div><div class="card"><h2>Produtos</h2><table class="table"><thead><tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Ativo</th><th>Ação</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>${money(p.price)}</td><td>${p.active===false?'Não':'Sim'}</td><td><button class="btn secondary" onclick="toggleProduct('${p.id}',${p.active===false})">${p.active===false?'Ativar':'Inativar'}</button></td></tr>`).join('')}</tbody></table></div>`}
async function addProduct(){const name=$('pname').value.trim(),price=Number($('pprice').value),category=$('pcat').value;if(!name||isNaN(price))return alert('Preencha nome e preço.');await api('/rest/v1/products',{method:'POST',headers:headers(true,{Prefer:'return=minimal'}),body:JSON.stringify({name,price,category,active:true})});await loadProducts();render()}
async function toggleProduct(id,active){await api('/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:headers(true,{Prefer:'return=minimal'}),body:JSON.stringify({active})});await loadProducts();render()}
function renderBairros(){$('content').innerHTML=`<div class="card"><h2>Novo bairro</h2><div class="row"><input id="bname" placeholder="Nome do bairro"><input id="btaxa" type="number" step="0.5" placeholder="Taxa"><button class="btn" onclick="addBairro()">Adicionar</button></div></div><div class="card"><h2>Bairros</h2><table class="table"><thead><tr><th>Nome</th><th>Taxa</th><th>Ativo</th><th>Ação</th></tr></thead><tbody>${bairros.map(b=>`<tr><td>${b.name}</td><td>${money(b.taxa)}</td><td>${b.active===false?'Não':'Sim'}</td><td><button class="btn secondary" onclick="toggleBairro('${b.id}',${b.active===false})">${b.active===false?'Ativar':'Inativar'}</button></td></tr>`).join('')}</tbody></table></div>`}
async function addBairro(){const name=$('bname').value.trim(),taxa=Number($('btaxa').value);if(!name||isNaN(taxa))return alert('Preencha nome e taxa.');await api('/rest/v1/bairros',{method:'POST',headers:headers(true,{Prefer:'return=minimal'}),body:JSON.stringify({name,taxa,active:true})});await loadBairros();render()}
async function toggleBairro(id,active){await api('/rest/v1/bairros?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:headers(true,{Prefer:'return=minimal'}),body:JSON.stringify({active})});await loadBairros();render()}
function renderFuncionamento(){const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];const closed=Array.isArray(settings.closed_days)?settings.closed_days.map(Number):[];$('content').innerHTML=`<div class="card"><h2>Funcionamento</h2><p class="notice">Status atual: <b>${settings.manual_closed?'Fechada manualmente':'Aberta'}</b></p><button class="btn ${settings.manual_closed?'green':'danger'}" onclick="toggleClosed()">${settings.manual_closed?'Abrir loja agora':'Fechar loja agora'}</button><h2 style="margin-top:18px">Dias fechados</h2>${dias.map((d,i)=>`<label style="display:block;margin:8px 0"><input type="checkbox" ${closed.includes(i)?'checked':''} onchange="setDay(${i},this.checked)"> ${d}</label>`).join('')}</div>`}
async function saveSettings(){await refresh();await api('/rest/v1/store_settings?on_conflict=key',{method:'POST',headers:headers(true,{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{key:'status',value:settings}])})}
async function toggleClosed(){settings.manual_closed=!settings.manual_closed;await saveSettings();render()}
async function setDay(day,checked){let arr=Array.isArray(settings.closed_days)?settings.closed_days.map(Number):[];if(checked&&!arr.includes(day))arr.push(day);if(!checked)arr=arr.filter(x=>x!==day);settings.closed_days=arr;await saveSettings();render()}
window.addEventListener('load',async()=>{try{session=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){} if(session&&await refresh()){showApp();await loadAll();render()} });
setInterval(()=>{if(session)loadOrders().then(()=>{if(current==='pedidos'||current==='dashboard')render()}).catch(()=>{})},10000);
</script>
</body>
</html>
